<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetsie App Landing Page</title>
    <link rel="canonical" href="https://codepen.io/Luis-Angel-Maciel/pen/pvgxwpz">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
            text-decoration: none;
            font-family: "Poppins", sans-serif;
        }

        .main {
            width: 100%;
            min-height: 100vh;
            background-color: #f8f9fa;
            position: relative;
            overflow: hidden;
        }

        .logo {
            height: 50px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 5%;
        }

        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu li a {
            margin: 0px 5px;
            font-size: .85rem;
            letter-spacing: 1px;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 500;
        }

        .menu-download {
            background-color: #fff;
            color: #111;
            box-shadow: 2px 2px 18px rgba(0, 0, 0, .05);
            transition: .3s all ease;
        }

        .menu-download:hover {
            background-color: #f08030;
            color: #fff;
        }

        .menu-buy {
            background-color: #f08030;
            color: #fff;
            box-shadow: 2px 2px 18px rgba(240, 128, 48, .3);
            transition: .3s all ease;
        }

        .menu-buy:hover {
            background-color: #d96d20;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            min-height: calc(100vh - 90px);
            position: relative;
        }

        .main-text {
            z-index: 2;
            max-width: 500px;
        }

        .main-text h1 {
            font-size: 3rem;
            color: #222;
            line-height: 1.2;
        }

        .main-text h1 span {
            color: #f08030;
        }

        .main-text p {
            font-size: 1.1rem;
            color: #666;
            margin-top: 16px;
        }

        .wrapper-img {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .wrapper-img img {
            height: 45px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .wrapper-img img:hover {
            transform: translateY(-3px);
        }

        .main-img {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-img img {
            max-height: 550px;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.15));
        }

        /* Background organic orange shape inspired by the reference image */
        .bg-shape {
            position: absolute;
            right: -100px;
            bottom: -150px;
            width: 700px;
            height: 700px;
            background-color: #f08030;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            z-index: 1;
            opacity: 0.9;
        }

        @media (max-width: 992px) {
            .container {
                flex-direction: column-reverse;
                text-align: center;
                padding: 40px 5%;
            }

            .main-text {
                max-width: 100%;
                margin-top: 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .main-text h1 {
                font-size: 2.3rem;
            }

            .main-img img {
                max-height: 400px;
            }

            .bg-shape {
                width: 400px;
                height: 400px;
                right: -100px;
                bottom: -100px;
            }
        }

        @media (max-width: 480px) {
            .main-text h1 {
                font-size: 1.8rem;
            }

            .menu-download {
                display: none;
            }

            .wrapper-img {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <section class="main">
        <div class="bg-shape"></div>
        <nav>
            <img src="https://i.postimg.cc/q7YcnW3s/logo.png" alt="Vetsie Logo" class="logo">
            <ul class="menu">
                <li><a href="#" class="menu-download">Download</a></li>
                <li><a href="#" class="menu-buy">Buy Vetsie</a></li>
            </ul>
        </nav>
        <div class="container">
            <div class="main-text">
                <h1>Modernizing Veterinary Care <span>for Pets</span></h1>
                <p>Reimagine how you communicate with your clients</p>
                <div class="wrapper-img">
                    <img src="https://i.postimg.cc/cCptL8rw/app1.png" alt="App Store Download">
                    <img src="https://i.postimg.cc/nz5C3QKg/app2.png" alt="Google Play Download">
                </div>
            </div>
            <div class="main-img">
                <img src="https://i.postimg.cc/DfrJK5hy/2.png" alt="Vetsie App Mockup Interface">
            </div>
        </div>
    </section>
</body>
</html>
